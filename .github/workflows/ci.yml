name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://webpresslite:webpresslite@127.0.0.1:5432/webpresslite
  ROOT_DOMAIN: lvh.me:3000
  APP_URL: http://lvh.me:3000
  S3_ENDPOINT: http://127.0.0.1:9000
  S3_REGION: us-east-1
  S3_BUCKET: webpresslite-media
  S3_ACCESS_KEY_ID: webpresslite
  S3_SECRET_ACCESS_KEY: webpresslite
  S3_FORCE_PATH_STYLE: 'true'
  AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
  CRON_SECRET: ci-cron-secret-ci-cron-secret

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm test

      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: webpresslite
          POSTGRES_PASSWORD: webpresslite
          POSTGRES_DB: webpresslite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webpresslite -d webpresslite"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Uploads go from the browser straight to the object store, so the e2e
      # run needs a real one. CORS has to be open or every upload preflight
      # fails before a single byte is transferred.
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: webpresslite
          MINIO_ROOT_PASSWORD: webpresslite
          MINIO_DEFAULT_BUCKETS: webpresslite-media:download
          MINIO_API_CORS_ALLOW_ORIGIN: '*'
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm db:migrate

      # The media suite uploads this image.
      - name: Testbild erzeugen
        run: |
          node -e "
          const sharp = require('sharp');
          const svg = '<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"900\"><rect width=\"1400\" height=\"900\" fill=\"#123a5f\"/><circle cx=\"450\" cy=\"420\" r=\"260\" fill=\"#e8b931\"/></svg>';
          sharp(Buffer.from(svg)).jpeg({ quality: 90 }).toFile('/tmp/testbild.jpg');
          "

      # Playwright starts the dev server itself and drives it via lvh.me:3000,
      # which resolves to 127.0.0.1 and matches APP_URL — Better Auth rejects
      # requests from any other origin.
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The production image is what actually ships, so a broken Dockerfile has to
  # fail here rather than on the server.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image bauen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: webpresslite:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Migrations-Runner im Image prüfen
        run: |
          # Without a database the runner must fail, and say why, rather than
          # starting a server against a schema it does not know.
          docker run --rm --entrypoint node \
            -e DATABASE_URL=postgres://x:y@127.0.0.1:5999/none \
            -e MIGRATE_RETRIES=1 -e MIGRATE_RETRY_DELAY_MS=100 \
            webpresslite:ci /app/dist/migrate.mjs && exit 1 || echo "runner failed as expected"

      - name: Compose-Datei prüfen
        run: |
          cp .env.example .env
          {
            echo "POSTGRES_USER=ci"
            echo "POSTGRES_PASSWORD=ci"
            echo "POSTGRES_DB=ci"
            echo "MINIO_CORS_ORIGINS=https://example.com"
          } >> .env
          docker compose -f docker-compose.prod.yml config > /dev/null
