name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://webpresslite:webpresslite@127.0.0.1:5432/webpresslite
  ROOT_DOMAIN: lvh.me:3000
  APP_URL: http://lvh.me:3000
  S3_ENDPOINT: http://127.0.0.1:9000
  S3_REGION: us-east-1
  S3_BUCKET: webpresslite-media
  S3_ACCESS_KEY_ID: webpresslite
  S3_SECRET_ACCESS_KEY: webpresslite
  S3_FORCE_PATH_STYLE: 'true'
  AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm test

      - run: pnpm build
