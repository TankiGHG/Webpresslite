services:
  postgres:
    image: postgres:16-alpine
    container_name: webpresslite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: webpresslite
      POSTGRES_PASSWORD: webpresslite
      POSTGRES_DB: webpresslite
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U webpresslite -d webpresslite']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: webpresslite-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: webpresslite
      MINIO_ROOT_PASSWORD: webpresslite
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot container that creates the media bucket on first start.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 webpresslite webpresslite &&
      mc mb --ignore-existing local/webpresslite-media &&
      mc anonymous set download local/webpresslite-media
      "

volumes:
  postgres-data:
  minio-data:
