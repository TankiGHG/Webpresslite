# Production stack for webpresslite.
#
# TLS and routing are handled by the Nginx Proxy Manager in front of this
# stack, so nothing here is published to the outside world: the app binds to
# localhost only, and Postgres and MinIO are reachable on the internal network
# alone.
#
# Copy .env.example to .env and fill it in before the first start.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: webpresslite:latest
    restart: unless-stopped
    env_file:
      # Everything the application reads at runtime. See .env.example.
      - path: .env
        required: true
    environment:
      NODE_ENV: production
      # Inside the network the services answer under their compose names.
      DATABASE_URL: postgres://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
      S3_ENDPOINT: http://minio:9000
    ports:
      # Bound to the loopback interface: only the proxy on this host reaches it.
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging: &logging
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      # Sensible defaults for a small single-host deployment.
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      # Browsers upload directly to MinIO with a presigned URL. Without CORS
      # for the real site origins every upload fails at the preflight.
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ORIGINS:?set MINIO_CORS_ORIGINS}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local || exit 1']
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *logging

  # One-shot: creates the media bucket and opens it for public reads. Exits
  # after it is done and is not restarted.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      mc anonymous set download local/$$S3_BUCKET
      "
    restart: 'no'
    logging: *logging

volumes:
  postgres-data:
  minio-data:
